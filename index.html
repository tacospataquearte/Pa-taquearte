<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PA'TAQUEARTE - Menú Interactivo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        agave: '#1A3326', // Verde agave oscuro y premium
                        'agave-hover': '#12241b',
                        terra: '#cc5500', // Terracota / Pastor
                        'terra-hover': '#a34400',
                        corn: '#fdf8e7', // Crema / Maíz
                        charcoal: '#2d2d2d',
                        'charcoal-light': '#4a4a4a',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #fdf8e7; 
            color: #2d2d2d; 
            overflow-x: hidden; 
        }
        
        /* Smooth Sidebar Transitions */
        .cart-sidebar {
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cart-sidebar.open {
            transform: translateX(0);
        }
        .overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Toast Notification */
        #toast-notification {
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #toast-notification.show {
            transform: translateY(0);
        }
        
        /* Premium Shadows */
        .premium-shadow {
            box-shadow: 0 4px 6px -1px rgba(26, 51, 38, 0.08), 0 2px 4px -1px rgba(26, 51, 38, 0.04);
        }
        
        /* Cart Bounce Animation */
        @keyframes popBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.4) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animate-pop { 
            animation: popBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        /* Fade-In Up Animation for Categories */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stagger-fade-in {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        /* Interaction Scale Down (Active state handles this nicely in Tailwind too) */
        .btn-press {
            transition: transform 0.1s ease-in-out;
        }
        .btn-press:active {
            transform: scale(0.92);
        }
        
        /* Card Hover Effects */
        .product-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .product-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 20px -8px rgba(26, 51, 38, 0.15);
        }
    </style>
</head>
<body class="antialiased pb-24">

    <header class="bg-agave shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center text-white">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-corn rounded-full flex items-center justify-center text-terra shadow-sm">
                    <i class="fa-solid fa-fire text-xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight">PA'TAQUEARTE</h1>
            </div>
            <button onclick="toggleCart()" class="relative p-2 text-white hover:text-corn transition-colors focus:outline-none btn-press group" id="cart-btn">
                <i class="fa-solid fa-cart-shopping text-2xl group-hover:scale-110 transition-transform"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-terra text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-agave transform scale-0 transition-transform duration-300">0</span>
            </button>
        </div>
    </header>

    <div class="bg-agave text-white py-14 px-4 text-center border-b-[6px] border-terra relative overflow-hidden">
        <!-- Decoraciones sutiles de fondo -->
        <div class="absolute inset-0 opacity-10 flex justify-center items-center pointer-events-none">
            <i class="fa-solid fa-pepper-hot text-9xl transform -rotate-12 translate-x-1/2"></i>
        </div>
        
        <div class="relative z-10 stagger-fade-in" style="animation-delay: 0.1s;">
            <h2 class="text-4xl md:text-5xl font-extrabold mb-4 drop-shadow-md tracking-tight">Auténticos y únicos</h2>
            <p class="text-corn max-w-xl mx-auto text-lg font-medium opacity-90">Selecciona tus favoritos, arma tu orden y pídela directo a nuestro WhatsApp. ¡El sabor de verdad!</p>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-4 py-10 relative">
        <div id="menu-container" class="space-y-16">
            <!-- El menú será inyectado aquí por JS -->
        </div>
    </main>

    <!-- Overlay del carrito -->
    <div id="cart-overlay" onclick="toggleCart()" class="overlay fixed inset-0 bg-charcoal/80 z-50 backdrop-blur-sm"></div>

    <!-- Panel Lateral del Carrito -->
    <div id="cart-sidebar" class="cart-sidebar fixed top-0 right-0 h-full w-full max-w-md bg-corn z-50 shadow-2xl flex flex-col">
        <div class="p-5 border-b border-gray-200/50 flex justify-between items-center bg-white shadow-sm z-10">
            <h2 class="text-xl font-bold text-charcoal flex items-center gap-2">
                <i class="fa-solid fa-basket-shopping text-terra"></i> Tu Orden
            </h2>
            <button onclick="toggleCart()" class="p-2 text-charcoal-light hover:text-terra hover:bg-red-50 rounded-full transition focus:outline-none btn-press">
                <i class="fa-solid fa-xmark text-xl w-6 h-6 flex items-center justify-center"></i>
            </button>
        </div>

        <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-4 no-scrollbar bg-corn relative">
            <!-- Items del carrito se inyectan aquí -->
        </div>

        <div class="p-6 border-t border-gray-200/50 bg-white shadow-[0_-15px_30px_-10px_rgba(26,51,38,0.1)] z-10 relative">
            <div id="cart-warning" class="hidden text-terra text-sm font-semibold mb-3 text-center bg-orange-50 p-3 rounded-xl border border-orange-100 animate-fade-in-up">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> Agrega al menos un producto.
            </div>
            <div class="flex justify-between items-end mb-5">
                <span class="text-charcoal-light font-bold text-lg mb-1">Total a pagar:</span>
                <span id="cart-total" class="text-4xl font-extrabold text-terra tracking-tight">$0.00</span>
            </div>
            <button onclick="sendToWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold py-4 px-6 rounded-xl shadow-lg flex justify-center items-center gap-3 transition-colors focus:outline-none text-lg btn-press">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                <span>Pedir por WhatsApp</span>
            </button>
        </div>
    </div>

    <!-- Notificación Toast -->
    <div id="toast-notification" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-agave text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-3 border border-agave-hover">
        <i class="fa-solid fa-check-circle text-terra"></i>
        <span id="toast-message" class="font-medium text-sm md:text-base">Notificación</span>
    </div>

    <script>
        // Lista de carnes base
        const meats = [
            { idSuffix: 'pastor', name: 'al Pastor' },
            { idSuffix: 'bistec', name: 'de Bistec' },
            { idSuffix: 'longaniza', name: 'de Longaniza' },
            { idSuffix: 'pechuga', name: 'de Pechuga (Pollo)' },
            { idSuffix: 'chorizo', name: 'de Chorizo Arg.' },
            { idSuffix: 'chistorra', name: 'de Chistorra' },
            { idSuffix: 'campechano', name: 'Campechano' }
        ];

        // Función para generar variantes rápidamente
        const generateItems = (prefixId, baseName, price, emoji) => {
            return meats.map(meat => ({
                id: `${prefixId}-${meat.idSuffix}`,
                name: `${baseName} ${meat.name}`,
                price: price,
                emoji: emoji
            }));
        };

        // Estructura completa del menú
        const menuData = [
            {
                category: "🌮 Tacos",
                items: generateItems('t', 'Taco', 24, '🌮')
            },
            {
                category: "🥪 Tortas",
                items: generateItems('tor', 'Torta', 40, '🥪')
            },
            {
                category: "🧀 Gringas",
                items: generateItems('g', 'Gringa', 55, '🧀')
            },
            {
                category: "🌮 Quesatacos",
                items: generateItems('q', 'Quesataco', 50, '🌮')
            },
            {
                category: "🌋 Volcanes",
                items: generateItems('v', 'Volcán', 25, '🌋')
            },
            {
                category: "🍽️ Órdenes (Viernes)",
                items: generateItems('o', 'Orden', 100, '🍽️')
            },
            {
                category: "🌶️ Chiles Rellenos",
                items: generateItems('c', 'Chile Relleno Asado', 15, '🌶')
            },
            {
                category: "🥩 Alambres",
                items: [
                    ...generateItems('a', 'Alambre', 110, '🥩'),
                    { 
                        id: 'a-combinado', 
                        name: 'Alambre Combinado', 
                        price: 110, 
                        emoji: '🥩',
                        desc: 'Elige tus carnes (especifícalo al enviar tu pedido).'
                    }
                ]
            },
            {
                category: "🧅 Extras",
                items: [
                    { id: 'ex-volcanes', name: 'Volcanes', price: 25, emoji: '🌋' },
                    { id: 'ex-cebollitas', name: 'Cebollitas', price: 20, emoji: '🧅' },
                    { id: 'ex-chiles', name: 'Chiles c/q', price: 10, emoji: '🌶️' }
                ]
            },
            {
                category: "🥤 Bebidas",
                items: [
                    { id: 'b-refresco', name: 'Refresco', price: 25, emoji: '🥤' }
                ]
            }
        ];

        let cart = [];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            menuData.forEach((section, index) => {
                const sectionHTML = document.createElement('div');
                // Calculate animation delay for stagger effect (0.1s increment per section)
                const animDelay = 0.1 + (index * 0.1);
                
                // Aplicar la clase para la animación de entrada
                sectionHTML.className = `stagger-fade-in`;
                sectionHTML.style.animationDelay = `${animDelay}s`;
                
                let itemsHTML = section.items.map(item => `
                    <div class="product-card bg-white rounded-2xl premium-shadow p-5 flex gap-4 h-full border border-gray-100 relative overflow-hidden group">
                        <!-- Pequeño acento decorativo -->
                        <div class="absolute top-0 right-0 w-16 h-16 bg-corn rounded-bl-[100px] -z-0 opacity-50 transition-colors group-hover:bg-[#faebd7]"></div>
                        
                        <div class="w-14 h-14 bg-corn rounded-xl flex items-center justify-center text-3xl shrink-0 border border-gray-100 z-10">
                            ${item.emoji}
                        </div>
                        <div class="flex-1 flex flex-col justify-between z-10">
                            <div>
                                <h4 class="font-bold text-charcoal leading-tight">${item.name}</h4>
                                ${item.desc ? `<p class="text-xs text-charcoal-light mt-1.5 leading-relaxed bg-corn p-2 rounded-md border border-gray-100">${item.desc}</p>` : ''}
                            </div>
                            <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-100/60">
                                <span class="font-extrabold text-terra text-lg">$${item.price.toFixed(2)}</span>
                                <div class="flex items-center gap-3" id="controls-${item.id}">
                                    <!-- Botón inicial de agregar -->
                                    <button onclick="addToCart('${item.id}', '${item.name}', ${item.price})" class="btn-press bg-terra hover:bg-terra-hover text-white font-bold px-4 py-2 rounded-full text-sm transition-colors shadow-sm focus:outline-none flex items-center gap-2">
                                        <i class="fa-solid fa-plus text-xs"></i> Agregar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

                sectionHTML.innerHTML = `
                    <h3 class="text-2xl font-black text-agave mb-6 flex items-center gap-3 uppercase tracking-wide border-b border-agave/10 pb-3">
                        <span class="bg-terra w-2 h-8 rounded-full inline-block"></span>
                        ${section.category}
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${itemsHTML}
                    </div>
                `;
                container.appendChild(sectionHTML);
            });
            updateMenuControls();
        }

        function getCartItem(id) {
            return cart.find(item => item.id === id);
        }

        function triggerCartAnimation() {
            const btn = document.getElementById('cart-btn');
            // Quitar clase por si estaba
            btn.classList.remove('animate-pop');
            // Forzar reflow
            void btn.offsetWidth;
            // Añadir animación
            btn.classList.add('animate-pop');
        }

        function addToCart(id, name, price) {
            const existing = getCartItem(id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
                showToast(`Agregado: ${name}`);
            }
            triggerCartAnimation();
            updateCartUI();
        }

        function updateQuantity(id, change) {
            const itemIndex = cart.findIndex(item => item.id === id);
            if (itemIndex > -1) {
                cart[itemIndex].quantity += change;
                if(change > 0) {
                    triggerCartAnimation(); // Animar si se suma
                }
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1); // Remover si llega a 0
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            // Actualizar badge
            badge.innerText = totalItems;
            if (totalItems > 0) {
                badge.style.transform = 'scale(1)';
                document.getElementById('cart-warning').classList.add('hidden');
            } else {
                badge.style.transform = 'scale(0)';
            }

            updateMenuControls();

            // Dibujar el carrito en el sidebar
            const cartItemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="text-center py-16 flex flex-col items-center justify-center h-full opacity-60">
                        <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-4 premium-shadow border border-gray-100">
                            <i class="fa-solid fa-basket-shopping text-4xl text-gray-300"></i>
                        </div>
                        <p class="font-bold text-charcoal text-lg">Tu orden está vacía</p>
                        <p class="text-sm mt-1 text-charcoal-light">Anímate a probar nuestros tacos</p>
                    </div>
                `;
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="bg-white p-4 rounded-xl premium-shadow border border-gray-100 flex justify-between items-center transition-all">
                        <div class="flex-1 pr-3">
                            <h5 class="font-bold text-charcoal text-sm leading-tight">${item.name}</h5>
                            <p class="text-terra font-extrabold mt-1 text-sm">$${(item.price * item.quantity).toFixed(2)}</p>
                        </div>
                        <div class="flex items-center gap-3 bg-corn rounded-lg p-1.5 border border-gray-200">
                            <button onclick="updateQuantity('${item.id}', -1)" class="btn-press w-8 h-8 flex items-center justify-center text-charcoal-light hover:bg-white hover:text-terra rounded-md hover:shadow-sm transition focus:outline-none">
                                <i class="fa-solid fa-minus text-sm"></i>
                            </button>
                            <span class="w-4 text-center font-bold text-base text-charcoal">${item.quantity}</span>
                            <button onclick="updateQuantity('${item.id}', 1)" class="btn-press w-8 h-8 flex items-center justify-center text-charcoal-light hover:bg-white hover:text-terra rounded-md hover:shadow-sm transition focus:outline-none">
                                <i class="fa-solid fa-plus text-sm"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // Calcular total
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function updateMenuControls() {
            // Actualiza los botones de cada item en el DOM para mostrar (+) y (-) o "Agregar"
            menuData.forEach(section => {
                section.items.forEach(item => {
                    const controlsDiv = document.getElementById(`controls-${item.id}`);
                    if (!controlsDiv) return;

                    const cartItem = getCartItem(item.id);
                    
                    if (cartItem) {
                        controlsDiv.innerHTML = `
                            <div class="flex items-center gap-1 bg-corn rounded-full p-1 border border-gray-200 premium-shadow">
                                <button onclick="updateQuantity('${item.id}', -1)" class="btn-press w-8 h-8 bg-white rounded-full flex items-center justify-center text-charcoal-light hover:text-terra hover:bg-gray-50 transition shadow-sm focus:outline-none">
                                    <i class="fa-solid fa-minus text-xs"></i>
                                </button>
                                <span class="font-bold w-8 text-center text-charcoal text-sm">${cartItem.quantity}</span>
                                <button onclick="updateQuantity('${item.id}', 1)" class="btn-press w-8 h-8 bg-terra text-white rounded-full flex items-center justify-center hover:bg-terra-hover transition shadow-sm focus:outline-none">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        `;
                    } else {
                        controlsDiv.innerHTML = `
                            <button onclick="addToCart('${item.id}', '${item.name}', ${item.price})" class="btn-press bg-terra hover:bg-terra-hover text-white font-bold px-5 py-2 rounded-full text-sm transition-colors shadow-sm focus:outline-none flex items-center gap-2">
                                <i class="fa-solid fa-plus text-xs"></i> Agregar
                            </button>
                        `;
                    }
                });
            });
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
            
            if(sidebar.classList.contains('open')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').innerText = message;
            
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                document.getElementById('cart-warning').classList.remove('hidden');
                return;
            }

            const phoneNumber = "5211234567890"; // Reemplaza con el número de la taquería
            
            let message = "🌮 *¡Hola PA'TAQUEARTE!* 🌮\nMe gustaría hacer el siguiente pedido:\n\n";
            let hasCombinado = false;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                message += `▪️ ${item.quantity}x ${item.name} - $${itemTotal.toFixed(2)}\n`;
                if(item.id === 'a-combinado') {
                    hasCombinado = true;
                }
            });
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            message += `\n*Total a pagar: $${total.toFixed(2)}*\n\n`;
            
            if(hasCombinado) {
                message += "⚠️ *Nota para mi Alambre Combinado:*\n(Escribe aquí las carnes que deseas: ______)\n\n";
            }

            message += "Quedo en espera de la confirmación. ¡Gracias! 🔥";

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        // Iniciar
        window.onload = () => {
            renderMenu();
            updateCartUI(); 
        };
    </script>
</body>
</html>
